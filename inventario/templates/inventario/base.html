<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="same-origin">
<title>{% block title %}Conferência de estoque{% endblock %}</title>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#182f39;background:#f2f6f7}body{margin:0}main{max-width:1120px;margin:0 auto;padding:24px 16px 64px}h1{font-size:1.9rem;line-height:1.2}h2{font-size:1.25rem}header{border-bottom:3px solid #18796c;background:white;padding:16px}header div{max-width:1120px;margin:auto}a{color:#086958}label{display:block;margin:12px 0;font-weight:600}input,select,textarea,button{font:inherit;box-sizing:border-box;max-width:100%}input:not([type=checkbox]),select,textarea{padding:12px;border:1px solid #a2b5ba;border-radius:8px;background:white;width:100%}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}button,.button{display:inline-block;border:0;border-radius:8px;padding:13px 18px;min-height:46px;background:#116f60;color:white;cursor:pointer;text-decoration:none;font-weight:650}button:disabled{background:#9aa8aa;cursor:default}.secondary{background:#e1ecea;color:#21493f}.card{background:white;padding:20px;margin:18px 0;border:1px solid #d8e2e5;border-radius:12px}.erro{padding:16px;background:#fff0eb;color:#8f2911;border-left:4px solid #b53c1d}.aviso{padding:16px;background:#fff7da;border-left:4px solid #c99a1c}.muted{color:#52696f;font-size:.95rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #d8e2e5;white-space:nowrap}details{margin:18px 0}summary{cursor:pointer;font-weight:650;padding:8px}.status{font-weight:650;color:#17634f}.historico{border-left:3px solid #c4d5da;padding-left:14px}.mobile{max-width:640px}.acoes{display:flex;gap:12px;flex-wrap:wrap}.mensagem{min-height:24px;margin-top:12px}.rodape{font-size:.9rem;color:#52696f}fieldset{border:0;padding:0;margin:0}code{overflow-wrap:anywhere}
</style>{% block head %}{% endblock %}</head><body><header><div>Estoque · Inventário físico</div></header><main>{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
