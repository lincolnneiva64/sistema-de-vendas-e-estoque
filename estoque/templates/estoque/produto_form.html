<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editar • {{ produto.nome }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f7fb; }
    .card-soft { border: 0; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
  </style>
</head>
<body>
  <div class="container py-4 py-lg-5">
    <div class="card card-soft">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="h4 mb-0">Editar produto</h1>
          <div class="d-flex gap-2">
            <a href="{% url 'produto_detalhe' produto.id %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </div>

        <form method="post" class="row g-3">
          {% csrf_token %}
          <div class="col-12 col-md-6"><label class="form-label">Nome</label>{{ form.nome }}</div>
          <div class="col-12 col-md-3"><label class="form-label">Código</label>{{ form.codigo }}</div>
          <div class="col-12 col-md-3"><label class="form-label">Categoria</label>{{ form.categoria }}</div>
          <div class="col-12 col-md-3"><label class="form-label">Preço</label>{{ form.preco }}</div>
          <div class="col-12 col-md-3"><label class="form-label">Quantidade</label>{{ form.quantidade }}</div>
          <div class="col-12 col-md-3"><label class="form-label">Estoque mínimo</label>{{ form.estoque_minimo }}</div>
          <div class="col-12 col-md-3"><label class="form-label">Fornecedor</label>{{ form.fornecedor }}</div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Salvar alterações</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
