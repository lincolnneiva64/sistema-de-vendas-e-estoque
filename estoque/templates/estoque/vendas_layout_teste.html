<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vendas - Layout Teste</title>

    <style>
    body {
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        background: #eef3f8;
        color: #1f2937;
    }

    #layout-vendas {
        max-width: 1400px;
        margin: 32px auto;
        padding: 0 20px 40px;
    }

    .bloco-venda {
        background: #ffffff;
        border: 1px solid #d9e2ec;
        border-radius: 18px;
        padding: 24px;
        margin-bottom: 22px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    h2 {
        margin: 0 0 22px;
        font-size: 34px;
        font-weight: 700;
        color: #0f172a;
    }

    h3 {
        margin: 0 0 16px;
        font-size: 24px;
        font-weight: 700;
        color: #1e3a8a;
    }

    .linha {
        display: grid;
        grid-template-columns: 2fr 1.4fr 1fr 2fr;
        gap: 14px;
        margin-bottom: 18px;
    }

    input,
    select {
    height: 48px;
    padding: 0 14px;
    border: 2px solid #94a3b8;
    border-radius: 12px;
    background: #ffffff;
    font-size: 17px;
    color: #0f172a;
    outline: none;
    transition: 0.18s ease;
    box-sizing: border-box;
}
.msg-edicao {
    display: inline-block;
    margin: 0 0 12px 12px;
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fcd34d;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    transform: translateY(-4px);
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
}
.msg-edicao.show {
    opacity: 1;
    transform: translateY(0);
}    input:focus,
select:focus {
    border-color: #1d4ed8;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.25);
}

    table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 14px;
        background: #ffffff;
    }

    thead {
        background: #dbeafe;
    }

    th {
        text-align: left;
        padding: 16px 14px;
        font-size: 16px;
        color: #1e3a8a;
        border-bottom: 1px solid #cbd5e1;
    }

    td {
        padding: 16px 14px;
        font-size: 16px;
        border-bottom: 1px solid #e5e7eb;
    }

    tbody tr:hover {
        background: #f8fbff;
    }
    .bloco-lancamento {
    border: 1px solid #93c5fd;
    background: #f0f7ff;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
}

}
</style>
</head>

<body>

<div id="layout-vendas">

    <div class="bloco-venda bloco-lancamento">
        <h2>Vendas</h2>

        <div class="linha">
            <input type="text" placeholder="Cliente">
            <input type="date">
            <select>
                <option>À vista</option>
                <option>Fiado</option>
            </select>
            <input type="text" placeholder="Operador">
        </div>

        <h3>Lançamento</h3>
<div id="msgEdicao" class="msg-edicao">Modo edição ativado</div>
        <div class="linha">
            <input type="text" id="produto" placeholder="Produto">
<input type="number" id="quantidade" placeholder="Qtd">
<input type="text" id="unidade" placeholder="Un">
<input type="text" id="preco" placeholder="Preço">
        </div>
    </div>

    <div class="bloco-venda">
        <h3>Itens</h3>

        <table>
            <thead>
    <tr>
        <th>Produto</th>
        <th>Qtd</th>
        <th>Un</th>
        <th>Preço</th>
        <th>Total</th>
    </tr>
</thead>
            <tbody id="tabelaProdutos">
                
            </tbody>
        </table>
        <div style="position: sticky; bottom: 0; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; font-weight:bold; background:#fff; padding:10px 0;">
    <div></div>
    <div></div>
    <div></div>
    <div style="text-align:right;">Total da venda:</div>
    <div id="totalGeral" style="text-align:right;">R$ 0,00</div>
</div>    </div>

</div>
<script>
    function mostrarMsgEdicao() {
    const msg = document.getElementById("msgEdicao");
    if (!msg) return;

    msg.classList.add("show");

    setTimeout(() => {
        msg.classList.remove("show");
    }, 2600);
}
document.addEventListener("DOMContentLoaded", function () {

  const produto = document.getElementById("produto");
  const quantidade = document.getElementById("quantidade");
  const unidade = document.getElementById("unidade");
  const preco = document.getElementById("preco");
  const tabelaBody = document.getElementById("tabelaProdutos");
let linhaSelecionada = null;
tabelaBody.addEventListener("click", function (e) {
  const linha = e.target.closest("tr");
  linhaSelecionada = linha;
if (!linha) return;

// limpa seleção primeiro
tabelaBody.querySelectorAll("tr").forEach(function (tr) {
    tr.style.background = "";
});

// marca a linha clicada
linha.style.background = "#e8f1ff";
mostrarMsgEdicao();
// pega dados
const nome = linha.children[0].textContent.trim();
const qtd = linha.children[1].textContent.trim();
const un = linha.children[2].textContent.trim();
const valor = linha.children[3].textContent.trim();

// joga nos inputs
produto.value = nome;
quantidade.value = qtd;
unidade.value = un;
preco.value = valor;
setTimeout(() => {
    window.scrollTo({ top: 0, behavior: "smooth" });
}, 50);
produto.focus();
produto.select();
    
});
  document.addEventListener("keydown", function (e) {
    const ativo = document.activeElement;

    if (e.key !== "Enter") return;

    if (ativo === produto) {
    e.preventDefault();
    quantidade.focus();
    quantidade.select();
} else if (ativo === quantidade) {
    e.preventDefault();
    unidade.focus();
    unidade.select();
} else if (ativo === unidade) {
    e.preventDefault();
    preco.focus();
    preco.select();

        } else if (ativo === preco) {
        e.preventDefault();

        const nomeProduto = produto.value.trim();
        const qtd = quantidade.value.trim();
        const un = unidade.value.trim();
        const valor = preco.value.trim();

        if (!nomeProduto || !qtd || !un || !valor) {
            alert("Preencha Produto, Qtd, Un e Preço.");
            return;
        }

        if (linhaSelecionada) {
            // EDITAR LINHA EXISTENTE
            linhaSelecionada.children[0].textContent = nomeProduto;
            linhaSelecionada.children[1].textContent = qtd;
            linhaSelecionada.children[2].textContent = un;
            linhaSelecionada.children[3].textContent = valor;
            const totalEdit = parseFloat(qtd) * parseFloat(valor);
linhaSelecionada.children[4].textContent = isNaN(totalEdit) ? "" : totalEdit.toFixed(2);
atualizarTotalGeral();
            linhaSelecionada.scrollIntoView({ behavior: "smooth", block: "center" });
            linhaSelecionada = null;
        } else {
            // CRIAR NOVA LINHA
            const novaLinha = document.createElement("tr");
            const total = parseFloat(qtd) * parseFloat(valor);

novaLinha.innerHTML =
    "<td>" + nomeProduto + "</td>" +
    "<td>" + qtd + "</td>" +
    "<td>" + un + "</td>" +
    "<td>" + valor + "</td>" +
    "<td>" + (isNaN(total) ? "" : total.toFixed(2)) + "</td>";
            tabelaBody.appendChild(novaLinha);
            atualizarTotalGeral();
            novaLinha.scrollIntoView({ behavior: "smooth", block: "nearest" });

            // destaque visual no último item
            tabelaBody.querySelectorAll("tr").forEach(tr => tr.style.background = "");
            novaLinha.style.background = "#e8f1ff";
        }

        produto.value = "";
        quantidade.value = "";
        unidade.value = "";
        preco.value = "";

        produto.focus({ preventScroll: true });
        produto.select();
        function atualizarTotalGeral() {
    let total = 0;

    tabelaBody.querySelectorAll("tr").forEach(tr => {
        const valor = parseFloat(tr.children[4].textContent);
        if (!isNaN(valor)) {
            total += valor;
        }
    });

    const totalDiv = document.getElementById("totalGeral");
    totalDiv.textContent = "R$ " + total.toFixed(2);
}
    }
});
});
</script>
</body>
</html>
