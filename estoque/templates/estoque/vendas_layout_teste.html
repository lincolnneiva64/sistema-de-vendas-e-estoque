<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vendas - Layout Teste</title>

    <style>
    body {
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        background: #eef3f8;
        color: #1f2937;
    }

    #layout-vendas {
        max-width: 1400px;
        margin: 32px auto;
        padding: 0 20px 40px;
    }

    .bloco-venda {
        background: #ffffff;
        border: 1px solid #d9e2ec;
        border-radius: 18px;
        padding: 24px;
        margin-bottom: 22px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    h2 {
        margin: 0 0 22px;
        font-size: 34px;
        font-weight: 700;
        color: #0f172a;
    }

    h3 {
        margin: 0 0 16px;
        font-size: 24px;
        font-weight: 700;
        color: #1e3a8a;
    }

    .linha {
        display: grid;
        grid-template-columns: 2fr 1.4fr 1fr 2fr;
        gap: 14px;
        margin-bottom: 18px;
    }

    input,
    select {
    height: 48px;
    padding: 0 14px;
    border: 2px solid #94a3b8;
    border-radius: 12px;
    background: #ffffff;
    font-size: 17px;
    color: #0f172a;
    outline: none;
    transition: 0.18s ease;
    box-sizing: border-box;
}

    input:focus,
select:focus {
    border-color: #1d4ed8;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.25);
}

    table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 14px;
        background: #ffffff;
    }

    thead {
        background: #dbeafe;
    }

    th {
        text-align: left;
        padding: 16px 14px;
        font-size: 16px;
        color: #1e3a8a;
        border-bottom: 1px solid #cbd5e1;
    }

    td {
        padding: 16px 14px;
        font-size: 16px;
        border-bottom: 1px solid #e5e7eb;
    }

    tbody tr:hover {
        background: #f8fbff;
    }
    .bloco-lancamento {
    border: 1px solid #93c5fd;
    background: #f0f7ff;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
}

}
</style>
</head>

<body>

<div id="layout-vendas">

    <div class="bloco-venda bloco-lancamento">
        <h2>Vendas</h2>

        <div class="linha">
            <input type="text" placeholder="Cliente">
            <input type="date">
            <select>
                <option>À vista</option>
                <option>Fiado</option>
            </select>
            <input type="text" placeholder="Operador">
        </div>

        <h3>Lançamento</h3>

        <div class="linha">
            <input type="text" id="produto" placeholder="Produto">
<input type="number" id="quantidade" placeholder="Qtd">
<input type="text" id="unidade" placeholder="Un">
<input type="text" id="preco" placeholder="Preço">
        </div>
    </div>

    <div class="bloco-venda">
        <h3>Itens</h3>

        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Qtd</th>
                    <th>Un</th>
                    <th>Preço</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Exemplo</td>
                    <td>1</td>
                    <td>UN</td>
                    <td>10.00</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

  const produto = document.getElementById("produto");
  const quantidade = document.getElementById("quantidade");
  const unidade = document.getElementById("unidade");
  const preco = document.getElementById("preco");

  document.addEventListener("keydown", function (e) {
    const ativo = document.activeElement;

    if (e.key !== "Enter") return;

    if (ativo === produto) {
      e.preventDefault();
      quantidade.focus();

    } else if (ativo === quantidade) {
      e.preventDefault();
      unidade.focus();

    } else if (ativo === unidade) {
      e.preventDefault();
      preco.focus();

    } else if (ativo === preco) {
      e.preventDefault();

      const nomeProduto = produto.value.trim();
      const qtd = quantidade.value.trim();
      const un = unidade.value.trim();
      const valor = preco.value.trim();

      if (!nomeProduto || !qtd || !un || !valor) {
        alert("Preencha Produto, Qtd, Un e Preço.");
        return;
      }

      const tbody = document.querySelector("tbody");

      const novaLinha = document.createElement("tr");
      novaLinha.innerHTML =
        "<td>" + nomeProduto + "</td>" +
        "<td>" + qtd + "</td>" +
        "<td>" + un + "</td>" +
        "<td>" + valor + "</td>";

      tbody.appendChild(novaLinha);

      produto.value = "";
      quantidade.value = "";
      unidade.value = "";
      preco.value = "";

      produto.focus();
    }
  });

});
</script>
</body>
</html>
