<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vendas - Layout Teste</title>

    <style>
    body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    background: #eef3f8;
    color: #1f2937;
    overflow: hidden;
}

    #layout-vendas {
    width: min(96vw, 1780px);
    height: 100vh;
    margin: 0 auto;
    padding: 16px 12px 18px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}

    .bloco-venda {
    background: #ffffff;
    border: 1px solid #d9e2ec;
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
}
.bloco-venda:not(.bloco-lancamento) {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}
    .estoque-preview {
    margin-top: 8px;
    margin-left: 0;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.2;
    color: #8a5a00;
    display: none;
    width: fit-content;
    padding: 6px 12px;
    border-radius: 10px;
    background: rgba(255, 193, 7, 0.22);
    border: 1px solid rgba(255, 193, 7, 0.48);
    min-height: auto;
}
    .bloco-itens-scroll {
    flex: 1;
    min-height: 0;
    max-height: none;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 2px;
    padding-bottom: 0;
    box-sizing: border-box;
    scrollbar-gutter: stable;
    border-bottom: 1px solid #dbe5f0;
    margin-bottom: 10px;
}

.bloco-itens-scroll table {
    border-radius: 0;
    margin-top: 0;
}

.bloco-itens-scroll thead {
    display: none;
}

.tabela-cabecalho-fixa {
    width: 100%;
    border-collapse: collapse;
    background: #dbeafe;
    border-radius: 14px 14px 0 0;
    overflow: hidden;
}

.tabela-cabecalho-fixa th {
    text-align: left;
    padding: 16px 14px;
    font-size: 16px;
    color: #1e3a8a;
    font-weight: 700;
}
    h2 {
    margin: 0 0 14px;
    font-size: 28px;
    font-weight: 800;
    color: #0f172a;
    line-height: 1.1;
}

h3 {
    margin: 0 0 10px;
    font-size: 20px;
    font-weight: 800;
    color: #1e3a8a;
    line-height: 1.1;
}

    .linha {
    display: grid;
    grid-template-columns: minmax(0, 2.2fr) 1.2fr 1fr 1.4fr;
    gap: 12px;
    margin-bottom: 10px;
    align-items: start;
}

    input,
select {
    height: 40px;
    padding: 0 12px;
    border: 2px solid #94a3b8;
    border-radius: 10px;
    background: #ffffff;
    font-size: 16px;
    color: #0f172a;
    outline: none;
    transition: 0.18s ease;
    box-sizing: border-box;
}
.produto-autocomplete-wrap {
    position: relative;
    width: 100%;
    min-width: 0;
}
#produtoBusca {
    width: 100%;
}

.produto-sugestoes {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;

    background: #ffffff;
    border: 1px solid #d0d7e2;
    border-radius: 14px;

    box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);

    max-height: 435px;
    overflow-y: auto;

    display: none;
    z-index: 50;

    backdrop-filter: blur(6px);
    animation: fadeDrop 0.18s ease;
}D
.produto-sugestao-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
}

.nome-item-sugestao {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.estoque-item-sugestao {
    font-size: 11px;
    font-weight: 700;
    color: #8a5a00;
    background: #fff3cd;
    border: 1px solid #f4c542;
    border-radius: 999px;
    padding: 2px 6px;
    white-space: nowrap;
}

.produto-sugestao-item.ativo .estoque-item-sugestao {
    color: #5f3700;
    background: #ffe08a;
    border-color: #e0a800;
}

.produto-sugestao-item {
    padding: 12px 16px;
    cursor: pointer;
    font-size: 15px;
    color: #0f172a;

    transition: all 0.15s ease;
    border-bottom: 1px solid #f1f5f9;
}

.produto-sugestao-item:last-child {
    border-bottom: none;
}

.produto-sugestao-item:hover,
.produto-sugestao-item.ativo {
    background: linear-gradient(90deg, #2563eb, #1d4ed8);
    color: #ffffff;

    transform: translateX(4px) scale(1.01);
}

.produto-sugestao-vazio {
    padding: 10px 14px;
    color: #6b7280;
    font-size: 14px;
}
.produto-sugestao-item strong {
    color: #2563eb;
    font-weight: 800;
    background: rgba(37, 99, 235, 0.14);
    padding: 0 3px;
    border-radius: 4px;
}

.produto-sugestao-item.ativo strong,
.produto-sugestao-item:hover strong {
    color: #fef08a;
    background: rgba(255, 255, 255, 0.18);
}
.msg-edicao {
    display: inline-block;
    margin: 0 0 12px 12px;
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fcd34d;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    transform: translateY(-4px);
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
}
.msg-edicao.show {
    opacity: 1;
    transform: translateY(0);
}    input:focus,
select:focus {
    border-color: #1d4ed8;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.25);
}

    table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 14px;
        background: #ffffff;
    }

    thead {
        background: #dbeafe;
    }

    th {
    text-align: left;
    padding: 10px 12px;
    font-size: 14px;
    color: #1e3a8a;
    border-bottom: 1px solid #cbd5e1;
    font-weight: 800;
}

td {
    padding: 10px 12px;
    font-size: 15px;
    border-bottom: 1px solid #e5e7eb;
}

    tbody tr:hover {
        background: #f8fbff;
    }
    .bloco-lancamento {
    border: 1px solid #93c5fd;
    background: #f0f7ff;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
}


</style>
</head>

<body>

<div id="layout-vendas">

    <div class="bloco-venda bloco-lancamento">
        <h2>Vendas</h2>

        <div class="linha">
            <input type="text" placeholder="Cliente">
            <input type="date">
            <select id="tipoVenda">
                <option>À vista</option>
                <option>Fiado</option>
            </select>
            <input type="text" placeholder="Operador">
        </div>

        <h3>Lançamento</h3>
<div id="msgEdicao" class="msg-edicao">Modo edição ativado</div>
        <div class="linha">
            <div class="produto-autocomplete-wrap">
    <input type="text" id="produtoBusca" placeholder="Selecione um produto" autocomplete="off">
    <div id="produtoSugestoes" class="produto-sugestoes"></div>
<div id="estoquePreview" class="estoque-preview"></div>

    <select id="produto" hidden>
        <option value="">Selecione um produto</option>
        {% for produto in produtos %}
            <option
    value="{{ produto.nome }}"
    data-unidade="{{ produto.unidade_venda_1|default_if_none:'' }}"
    data-preco="{{ produto.preco_venda|default_if_none:'' }}"
    data-estoque="{{ produto.quantidade|default_if_none:0 }}"
    data-fracionado="{{ produto.vende_fracionado|yesno:'true,false' }}"
    data-unidade2="{{ produto.unidade_venda_2|default_if_none:'' }}"
    data-fator="{{ produto.fator_conversao|default_if_none:'' }}"
    data-preco2="{{ produto.preco_vista_fracionado|default_if_none:'' }}"
>
    {{ produto.nome }}
</option>
        {% endfor %}
    </select>
</div>
<input type="number" id="quantidade" placeholder="Qtd">
<select id="unidade">
    <option value="">Un</option>
</select>
<input type="text" id="preco" placeholder="Preço">
        </div>
    </div>

    <div class="bloco-venda">
    <h3>Itens</h3>

    <div class="bloco-itens-scroll">
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Qtd</th>
                <th>Un</th>
                <th>Preço</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="tabelaProdutos">
        </tbody>
    </table>
</div>
        <div id="resumoVenda" style="
    margin-top: 10px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    border: 1px solid #bfdbfe;
    border-radius: 14px;
">
    <div id="contadorItens" style="
        font-size: 16px;
        font-weight: 800;
        color: #1e3a8a;
    ">Itens: 0</div>

    <div style="
        font-size: 16px;
        font-weight: 800;
        color: #334155;
    ">Total da venda:</div>

    <div id="totalGeral" style="
        min-width: 170px;
        text-align: right;
        font-size: 30px;
        font-weight: 900;
        color: #166534;
        line-height: 1;
    ">R$ 0,00</div>
</div>

</div>
<script>
    function mostrarMsgEdicao() {
    const msg = document.getElementById("msgEdicao");
    if (!msg) return;

    msg.classList.add("show");

    setTimeout(() => {
        msg.classList.remove("show");
    }, 2600);
}
document.addEventListener("DOMContentLoaded", function () {
const itensScroll = document.querySelector(".bloco-itens-scroll");

function scrollLinhaDentroDaLista(linha, behavior = "smooth") {
    if (!itensScroll || !linha) return;

    const topLinha = linha.offsetTop;
    const bottomLinha = topLinha + linha.offsetHeight;
    const topVisivel = itensScroll.scrollTop;
    const bottomVisivel = topVisivel + itensScroll.clientHeight;

    if (bottomLinha > bottomVisivel) {
    const folgaInferior = 56;

    itensScroll.scrollTo({
        top: Math.max(0, bottomLinha - itensScroll.clientHeight + folgaInferior),
        behavior
    });
} else if (topLinha < topVisivel) {
    itensScroll.scrollTo({
        top: topLinha,
        behavior
    });
}
}

  const produto = document.getElementById("produto");
  const tipoVenda = document.getElementById("tipoVenda");
const produtoBusca = document.getElementById("produtoBusca");
const sugestoesBox = document.getElementById("produtoSugestoes");
const estoquePreview = document.getElementById("estoquePreview");
const quantidade = document.getElementById("quantidade");
const unidade = document.getElementById("unidade");
const preco = document.getElementById("preco");
const tabelaBody = document.getElementById("tabelaProdutos");
  produto.addEventListener("change", function () {
    const optionSelecionada = this.options[this.selectedIndex];
    if (!optionSelecionada) return;

    unidade.value = optionSelecionada.dataset.unidade || "";
    preco.value = optionSelecionada.dataset.preco || "";
});
let linhaSelecionada = null;
let ultimoItemRemovido = null;
tabelaBody.addEventListener("click", function (e) {
  const linha = e.target.closest("tr");
  linhaSelecionada = linha;
if (!linha) return;

// limpa seleção primeiro
tabelaBody.querySelectorAll("tr").forEach(function (tr) {
    tr.style.background = "";
});

// marca a linha clicada
linha.style.background = "#e8f1ff";
mostrarMsgEdicao();
// pega dados
const nome = linha.children[0].textContent.trim();
const qtd = linha.children[1].textContent.trim();
const un = linha.children[2].textContent.trim();
const valor = linha.children[3].textContent.trim();

// joga nos inputs
produto.value = nome;
produto.dispatchEvent(new Event("change"));
produtoBusca.value = nome;
const optionEdicao = Array.from(produto.options).find(opt => opt.text.trim() === nome);

if (optionEdicao) {
    const unidade1Edicao = optionEdicao.dataset.unidade1 || "";
const unidade2Edicao = optionEdicao.dataset.unidade2 || "";
const fracionadoEdicao = optionEdicao.dataset.fracionado === "true";
const fatorEdicao = parseFloat(optionEdicao.dataset.fator || "0");
const estoqueBaseEdicao = parseFloat(optionEdicao.dataset.estoque || "0");
const estoqueConvertidoEdicao = fatorEdicao > 0 ? estoqueBaseEdicao * fatorEdicao : estoqueBaseEdicao;

if (fracionadoEdicao && unidade2Edicao) {
    estoquePreview.innerText = `Estoque: ${estoqueBaseEdicao} ${unidade1Edicao} | ${estoqueConvertidoEdicao} ${unidade2Edicao}`;
} else {
    estoquePreview.innerText = `Estoque: ${estoqueBaseEdicao} ${unidade1Edicao}`;
}
    estoquePreview.style.display = "inline-block";
} else {
    estoquePreview.innerText = "";
    estoquePreview.style.display = "none";
}
quantidade.value = qtd;

unidade.innerHTML = "";

if (optionEdicao) {
    const unidade1Edicao = optionEdicao.dataset.unidade1 || optionEdicao.dataset.unidade || "";
    const unidade2Edicao = optionEdicao.dataset.unidade2 || "";
    const fracionadoEdicao = optionEdicao.dataset.fracionado === "true";

    if (unidade1Edicao) {
        const op1 = document.createElement("option");
        op1.value = unidade1Edicao;
        op1.textContent = unidade1Edicao;
        unidade.appendChild(op1);
    }

    if (fracionadoEdicao && unidade2Edicao) {
        const op2 = document.createElement("option");
        op2.value = unidade2Edicao;
        op2.textContent = unidade2Edicao;
        unidade.appendChild(op2);
    }
}

unidade.value = un;
preco.value = valor;setTimeout(() => {
    window.scrollTo({ top: 0, behavior: "smooth" });
}, 50);
produtoBusca.focus();
produtoBusca.select();
    
});
function mostrarAviso(mensagem, campo = null, selecionar = false) {
    let aviso = document.getElementById("aviso-validacao");

    if (!aviso) {
        aviso = document.createElement("div");
        aviso.id = "aviso-validacao";
        aviso.style.position = "fixed";
        aviso.style.top = "32px";
        aviso.style.left = "50%";
        aviso.style.transform = "translateX(-50%)";
        aviso.style.zIndex = "9999";
        aviso.style.minWidth = "420px";
        aviso.style.maxWidth = "520px";
        aviso.style.padding = "18px 20px";
        aviso.style.borderRadius = "16px";
        aviso.style.background = "#fff7e6";
        aviso.style.border = "1px solid #f4d38a";
        aviso.style.boxShadow = "0 16px 36px rgba(180, 120, 20, 0.18)";
        aviso.style.color = "#5f3b00";
        aviso.style.fontSize = "18px";
        aviso.style.fontWeight = "500";
        aviso.style.display = "flex";
        aviso.style.alignItems = "center";
        aviso.style.justifyContent = "space-between";
        aviso.style.gap = "12px";

        const texto = document.createElement("span");
        texto.id = "aviso-validacao-texto";

        const botao = document.createElement("button");
        botao.type = "button";
        botao.textContent = "OK";
        botao.style.border = "none";
        botao.style.background = "#d97706";
        botao.style.color = "#ffffff";
        botao.style.padding = "10px 18px";
        botao.style.borderRadius = "12px";
        botao.style.cursor = "pointer";
        botao.style.fontWeight = "600";
        botao.style.fontSize = "16px";

        function fecharAviso() {
            const avisoAtual = document.getElementById("aviso-validacao");
            if (avisoAtual) {
                avisoAtual.remove();
            }

            document.removeEventListener("keydown", enterAvisoHandler);

            if (campo) {
                campo.focus();
                if (selecionar && typeof campo.select === "function") {
                    campo.select();
                }
            }
        }

        function enterAvisoHandler(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                fecharAviso();
            }
        }

        botao.addEventListener("click", fecharAviso);
        document.addEventListener("keydown", enterAvisoHandler);

        aviso.appendChild(texto);
        aviso.appendChild(botao);
        document.body.appendChild(aviso);

        botao.focus();
    }

    const textoEl = document.getElementById("aviso-validacao-texto");
    if (textoEl) {
        textoEl.textContent = mensagem;
    }
}
  function atualizarTotalGeral() {
    let total = 0;
    const linhas = tabelaBody.querySelectorAll("tr");

    linhas.forEach((tr) => {
        const texto = tr.children[4].textContent
            .replace("R$", "")
            .replace(",", ".")
            .trim();

        const valor = parseFloat(texto);
        if (!isNaN(valor)) {
            total += valor;
        }
    });

    const totalDiv = document.getElementById("totalGeral");
    if (totalDiv) {
        totalDiv.textContent = "R$ " + total.toFixed(2);
    }

    const contadorItens = document.getElementById("contadorItens");
    if (contadorItens) {
        contadorItens.textContent = "Itens: " + linhas.length;
    }
} 
  function confirmarExclusaoPersonalizada(nomeProduto = "este item") {
    return new Promise((resolve) => {
        const existente = document.getElementById("modal-excluir-venda");
        if (existente) existente.remove();

        const overlay = document.createElement("div");
        overlay.id = "modal-excluir-venda";
        overlay.style.position = "fixed";
        overlay.style.inset = "0";
        overlay.style.background = "rgba(15, 23, 42, 0.45)";
        overlay.style.backdropFilter = "blur(4px)";
        overlay.style.display = "flex";
        overlay.style.alignItems = "center";
        overlay.style.justifyContent = "center";
        overlay.style.zIndex = "99999";

        overlay.innerHTML = `
            <div id="box-excluir-venda" style="
                width:min(520px, calc(100vw - 32px));
                background:#ffffff;
                border-radius:20px;
                overflow:hidden;
                box-shadow:0 24px 60px rgba(15,23,42,0.28);
                border:1px solid #dbe3ee;
                font-family:inherit;
            ">
                <div style="
                    display:flex;
                    align-items:center;
                    gap:12px;
                    padding:18px 22px;
                    background:linear-gradient(135deg,#fff7e6 0%, #ffe8bf 100%);
                    border-bottom:1px solid #f3d28f;
                ">
                    <div style="
                        width:42px;
                        height:42px;
                        border-radius:12px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:22px;
                        background:#f59e0b;
                        color:#ffffff;
                        font-weight:800;
                        flex-shrink:0;
                    ">!</div>

                    <div>
                        <div style="font-size:24px;font-weight:800;color:#7c2d12;line-height:1.1;">
                            Excluir item
                        </div>
                        <div style="font-size:14px;color:#9a3412;margin-top:2px;">
                            Confirme a remoção do item selecionado
                        </div>
                    </div>
                </div>

                <div style="padding:24px 22px 22px 22px;">
                    

<div style="font-size:21px;font-weight:700;color:#111827;line-height:1.35;">
    Confirmar exclusão de<br>
<span style="color:#7c2d12;">${nomeProduto}</span>?
</div>
                    

                    <div style="
                        margin-top:12px;
                        display:inline-block;
                        padding:8px 12px;
                        border-radius:999px;
                        background:#fef2f2;
                        border:1px solid #fecaca;
                        color:#b91c1c;
                        font-size:13px;
                        font-weight:700;
                    ">
                        Essa ação altera o total da venda
                    </div>

                    <div style="
                        margin-top:24px;
                        display:flex;
                        justify-content:flex-end;
                        gap:12px;
                    ">
                        <button id="btn-cancelar-excluir" type="button" style="
                            border:none;
                            background:#e5e7eb;
                            color:#111827;
                            height:46px;
                            min-width:140px;
                            border-radius:14px;
                            font-size:17px;
                            font-weight:700;
                            cursor:pointer;
                        ">
                            Cancelar
                        </button>

                        <button id="btn-confirmar-excluir" type="button" style="
                            border:none;
                            background:linear-gradient(135deg,#ef4444 0%, #dc2626 100%);
                            color:#ffffff;
                            height:50px;
                            min-width:128px;
                            border-radius:14px;
                            font-size:18px;
                            font-weight:800;
                            cursor:pointer;
                            box-shadow:0 10px 24px rgba(220,38,38,0.28);
                        ">
                            Excluir item
                        </button>
                    </div>
                </div>
            </div>
        `;

        document.body.appendChild(overlay);

        const btnCancelar = document.getElementById("btn-cancelar-excluir");
        const btnConfirmar = document.getElementById("btn-confirmar-excluir");

        function fechar(resultado) {
            document.removeEventListener("keydown", teclaModal, true);
            overlay.remove();
            resolve(resultado);
        }

        function teclaModal(e) {
            if (e.key === "Escape") {
    e.preventDefault();
    fechar(false);
} else if (e.key === "Enter") {
    e.preventDefault();

    if (document.activeElement === btnCancelar) {
        fechar(false);
    } else {
        fechar(true);
    }
} else if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Tab") {
    e.preventDefault();

    if (document.activeElement === btnConfirmar) {
        btnCancelar.focus();
    } else {
        btnConfirmar.focus();
    }
}
        }

        btnCancelar.onclick = () => fechar(false);
        btnConfirmar.onclick = () => fechar(true);

        overlay.addEventListener("click", function (e) {
            if (e.target === overlay) fechar(false);
        });

        document.addEventListener("keydown", teclaModal, true);
        btnConfirmar.focus();
    });
} 
  document.addEventListener("keydown", async function (e) {
if (e.key === "Delete") {

    if (linhaSelecionada) {
const nomeProduto = linhaSelecionada.children[0]?.innerText?.trim() || "este item";
const confirmar = await confirmarExclusaoPersonalizada(nomeProduto);
if (!confirmar) return;

// guarda a linha removida
ultimoItemRemovido = {
    html: linhaSelecionada.outerHTML,
    index: Array.from(tabelaBody.children).indexOf(linhaSelecionada)
};
linhaSelecionada.remove();
        linhaSelecionada = null;

        atualizarTotalGeral();


        estoquePreview.innerText = "";

function prepararProdutoParaProximoLancamento() {
    autocompleteAberto = true;
    filtrarProdutos("");

    if (ultimoProdutoIndex >= 0 && sugestoes.length) {
        const opcoesValidas = Array.from(produto.querySelectorAll("option")).filter((opt) => {
            const nome = (opt.value || "").trim();
            return nome;
        });

        const proximoIndexReal = ultimoProdutoIndex + 1;

        if (proximoIndexReal < opcoesValidas.length) {
            const proximoValor = opcoesValidas[proximoIndexReal].value;
            const indiceNaSugestao = sugestoes.findIndex(opt => opt.value === proximoValor);
            indexAtivo = indiceNaSugestao >= 0 ? indiceNaSugestao : 0;
        } else {
            indexAtivo = 0;
        }
    }

    renderSugestoes();
}
function limparLinhaLancamento() {
    ultimoProdutoIndex = produto.selectedIndex - 1;
    produtoBusca.value = "";
    produto.value = "";    quantidade.value = "";

    preco.value = "";

    setTimeout(() => {
    produtoBusca.focus();

// ================= AUTOCOMPLETE PRODUTO =================

let sugestoes = [];
let indexAtivo = -1;
let autocompleteAberto = false;
let ultimoProdutoIndex = -1;

function filtrarProdutos(texto) {
  const termo = texto.toLowerCase().trim();
  const primeiraLetra = termo.charAt(0);

  const opcoes = Array.from(produto.querySelectorAll("option")).filter((opt) => {
    const nome = (opt.value || "").toLowerCase().trim();
    return nome;
  });

  const comecaComTermo = opcoes.filter((opt) => {
    const nome = opt.value.toLowerCase().trim();
    return nome.startsWith(termo);
  });

  const segueOrdemAlfabetica = opcoes.filter((opt) => {
    const nome = opt.value.toLowerCase().trim();
    const inicial = nome.charAt(0);
    return inicial >= primeiraLetra && !nome.startsWith(termo);
  });
const contemEmOutraPalavra = opcoes.filter((opt) => {
    const nome = opt.value.toLowerCase().trim();

    if (nome.startsWith(termo)) return false;

    const palavras = nome.split(/\s+/);
    return palavras.some((palavra, index) => index > 0 && palavra.includes(termo));
});
  sugestoes = [...comecaComTermo, ...contemEmOutraPalavra, ...segueOrdemAlfabetica];
  indexAtivo = sugestoes.length ? 0 : -1;
}
function renderSugestoes() {
    sugestoesBox.innerHTML = "";

    if (!sugestoes.length) {
    sugestoesBox.style.display = "none";
    estoquePreview.textContent = "";
    return;
}

    sugestoes.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "produto-sugestao-item" + (i === indexAtivo ? " ativo" : "");

    const texto = opt.value;
    const termo = produtoBusca.value.trim();
    const estoque = opt.dataset.estoque || "0";

    const regex = termo ? new RegExp(`(${termo})`, "i") : null;
    const textoHighlight = regex ? texto.replace(regex, `<strong>$1</strong>`) : texto;

    div.innerHTML = `
    <span class="nome-item-sugestao">${textoHighlight}</span>
    <span class="estoque-item-sugestao">Est: ${estoque}</span>
`;

    div.addEventListener("mouseenter", () => {
        const unidadeBaseSug = opt.dataset.unidade1 || "";
const unidadeFracSug = opt.dataset.unidade2 || "";
const fracionadoSug = opt.dataset.fracionado === "true";
const fatorSug = parseFloat(opt.dataset.fator || "0");
const estoqueBaseSug = parseFloat(opt.dataset.estoque || "0");
const estoqueConvertidoSug = fatorSug > 0 ? estoqueBaseSug * fatorSug : estoqueBaseSug;

if (fracionadoSug && unidadeFracSug) {
    estoquePreview.textContent = `Estoque: ${estoqueBaseSug} ${unidadeBaseSug} | ${estoqueConvertidoSug} ${unidadeFracSug}`;
} else {
    estoquePreview.textContent = `Estoque: ${estoqueBaseSug} ${unidadeBaseSug}`;
}
        estoquePreview.style.display = "inline-block";
    });

    div.addEventListener("mousedown", () => selecionarProduto(opt));

    sugestoesBox.appendChild(div);
});

    sugestoesBox.style.display = "block";
    const itemAtivo = sugestoesBox.querySelector(".produto-sugestao-item.ativo");
if (itemAtivo) {
    itemAtivo.scrollIntoView({
        block: "nearest",
        behavior: "smooth"
    });
}
}
function selecionarProduto(opt) {
produto.value = opt.value;
produtoBusca.value = opt.value;

unidade.innerHTML = "";

const unidade1 = opt.dataset.unidade || "";
const unidade2 = opt.dataset.unidade2 || "";
const fracionado = opt.dataset.fracionado === "true";

if (unidade1) {
    unidade.innerHTML += `<option value="${unidade1}">${unidade1}</option>`;
}

if (fracionado && unidade2) {
    unidade.innerHTML += `<option value="${unidade2}">${unidade2}</option>`;
}

unidade.value = unidade1;
const estoqueBaseSelecionado = parseFloat(opt.dataset.estoque || "0");
const fatorSelecionado = parseFloat(opt.dataset.fator || "0");
const unidadeBaseSelecionada = opt.dataset.unidade1 || "";
const unidadeFracSelecionada = opt.dataset.unidade2 || "";
const fracionadoSelecionado = opt.dataset.fracionado === "true";
const estoqueConvertidoSelecionado =
    fatorSelecionado > 0 ? estoqueBaseSelecionado * fatorSelecionado : estoqueBaseSelecionado;

if (fracionadoSelecionado && unidadeFracSelecionada) {
    estoquePreview.textContent = `Estoque: ${estoqueBaseSelecionado} ${unidadeBaseSelecionada} | ${estoqueConvertidoSelecionado} ${unidadeFracSelecionada}`;
} else {
    estoquePreview.textContent = `Estoque: ${estoqueBaseSelecionado} ${unidadeBaseSelecionada}`;
}
estoquePreview.style.display = "inline-block";

preco.value = opt.dataset.preco || "";

// dispara o MESMO fluxo do select
produto.dispatchEvent(new Event("change"));

sugestoesBox.style.display = "none";
    autocompleteAberto = false;
    indexAtivo = -1;

    quantidade.focus();
    quantidade.select();
}
unidade.addEventListener("change", () => {
    const nomeProduto = produto.value.trim();
    const opt = Array.from(produto.options).find(option => option.value.trim() === nomeProduto);

    if (!opt) return;

    const unidade1 = opt.dataset.unidade || "";
    const unidade2 = opt.dataset.unidade2 || "";
    const fracionado = opt.dataset.fracionado === "true";
    const fator = parseFloat(opt.dataset.fator || "0");
const estoqueBase = parseFloat(opt.dataset.estoque || "0");
let precoBase = opt.dataset.preco || "";
let precoFracionado = opt.dataset.preco2 || "";

    if (unidade.value === unidade1) {
        if (fracionado && unidade2) {
    estoquePreview.textContent = `Estoque: ${estoqueBase} ${unidade1} | ${estoqueBase * (fator > 0 ? fator : 1)} ${unidade2}`;
} else {
    estoquePreview.textContent = `Estoque: ${estoqueBase} ${unidade1}`;
}
        preco.value = precoBase;
        return;
    }

    if (fracionado && unidade.value === unidade2) {
        let estoqueConvertido = estoqueBase;

        if (fator > 0) {
            estoqueConvertido = estoqueBase * fator;
        }

        estoquePreview.textContent = `Estoque: ${estoqueBase} ${unidade1} | ${estoqueConvertido} ${unidade2}`;
        preco.value = precoFracionado;
    }
});
produtoBusca.addEventListener("input", () => {
    autocompleteAberto = true;

    const texto = produtoBusca.value.trim();

    if (!texto) {
    sugestoesBox.style.display = "none";
    estoquePreview.textContent = "";
    return;
}
    filtrarProdutos(texto);
    renderSugestoes();
});
produtoBusca.addEventListener("click", () => {
    autocompleteAberto = true;

    const texto = produtoBusca.value.trim();

    filtrarProdutos(texto);
    renderSugestoes();
});

produtoBusca.addEventListener("blur", () => {
    setTimeout(() => {
        autocompleteAberto = false;
        sugestoesBox.style.display = "none";

        if (!produto.value) {
    estoquePreview.textContent = "";
    estoquePreview.style.display = "none";
}
    }, 150);
});
produtoBusca.addEventListener("keydown", (e) => {
    

    if (e.key === "ArrowDown") {
        e.preventDefault();
        indexAtivo = (indexAtivo + 1) % sugestoes.length;
        renderSugestoes();
    }

    else if (e.key === "ArrowUp") {
        e.preventDefault();
        indexAtivo = (indexAtivo - 1 + sugestoes.length) % sugestoes.length;
        renderSugestoes();
    }

    else if (e.key === "Enter") {
    e.preventDefault();
    e.stopPropagation();

    if (indexAtivo >= 0) {
        selecionarProduto(sugestoes[indexAtivo]);
    } else if (produtoBusca.value.trim()) {
        quantidade.focus();
        quantidade.select();
    }
}
    

    else if (e.key === "Escape") {
        sugestoesBox.style.display = "none";
        estoquePreview.textContent = "";
    }
});

document.addEventListener("click", (e) => {
    if (!sugestoesBox.contains(e.target) && e.target !== produtoBusca) {
    sugestoesBox.style.display = "none";

    if (!produtoBusca.value.trim()) {
        estoquePreview.textContent = "";
    }
}
});

atualizarTotalGeral();

});
