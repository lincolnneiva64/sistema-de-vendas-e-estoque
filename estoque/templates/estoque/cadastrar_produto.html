<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastrar Produto</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <span class="navbar-brand fw-semibold">Meia Meia</span>

      <div class="ms-auto">
        <a class="btn btn-outline-secondary" href="{% url 'estoque:home' %}">
          Voltar
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-5">

    <div class="bg-white border rounded-3 p-4 p-md-5 shadow-sm">
      
      <p class="text-muted mb-4">Preencha os dados abaixo.</p>

      <form method="post" class="row g-3">
        {% csrf_token %}

        <div class="col-12">
          {{ form.as_p }}
        </div>

        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            Salvar
          </button>

          <a class="btn btn-secondary" href="{% url 'estoque:home' %}">
            Cancelar
          </a>
        </div>
      </form>
    </div>

  </main>

</body>
</html>
