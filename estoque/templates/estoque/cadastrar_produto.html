<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastrar Produto</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <span class="navbar-brand fw-semibold">Meia Meia</span>

      <div class="ms-auto">
        <a class="btn btn-outline-secondary" href="{% url 'estoque:home' %}">
          Voltar
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-5">

    <div class="bg-white border rounded-3 p-3 p-md-4 shadow-sm mx-auto" style="max-width: 720px;">
      
      <p class="text-muted mb-4">Preencha os dados abaixo.</p>

      <form method="post" class="row g-2">
  {% csrf_token %}

  <div class="col-12 col-md-6">
    <label class="form-label">Nome</label>
    {{ form.nome }}
  </div>

  <div class="col-12 col-md-4">
    <label class="form-label">Código</label>
    {{ form.codigo }}
  </div>

  <div class="col-12 col-md-4">
    <label class="form-label">Categoria</label>
    {{ form.categoria }}
  </div>

  <div class="col-12 col-md-4">
    <label class="form-label">Preço compra</label>
    {{ form.preco_compra }}
  </div>

  <div class="col-12 col-md-4">
    <label class="form-label">Preço venda</label>
    {{ form.preco_venda }}
  </div>

  <div class="col-12 col-md-6">
    <label class="form-label">Quantidade</label>
    {{ form.quantidade }}
  </div>

  <div class="col-12 col-md-6">
    <label class="form-label">Estoque mínimo</label>
    {{ form.estoque_minimo }}
  </div>

  <div class="col-12">
        <label class="form-label">Fornecedor</label>
    {{ form.fornecedor }}
  </div>

  <div class="col-12 d-flex gap-2 pt-2">
    <button type="submit" class="btn btn-primary px-4">Salvar</button>
    <a class="btn btn-outline-secondary px-4" href="{% url 'estoque:home' %}">Cancelar</a>
  </div>
</form>
      
    </div>

  </main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const campos = document.querySelectorAll("input");

  campos.forEach((campo, index) => {
    campo.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();

        const proximo = campos[index + 1];

        if (proximo) {
          proximo.focus();
        } else {
          document.querySelector("form").submit();
        }
      }
    });
  });
});
</script>
</body>
</html>
