{% extends 'estoque/base.html' %}

{% block content %}
<style>
.aviso-erro {
    display: none;
    background: #fff1f0;
    color: #cf1322;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 8px;
    font-weight: 500;
    border-left: 5px solid #ff4d4f;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    animation: slideDown 0.2s ease;

    width: fit-content;
    max-width: 500px;
    margin-left: 2px;
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-6px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
<div style="padding: 10px; height: 100vh; display: flex; flex-direction: column;">

    <!-- TOPO -->
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <div>Nº: 000001</div>
        <div>Data: {{ now|date:"d/m/Y" }}</div>
        <div>Cliente: ____________________</div>
        <div>Pagamento: 
            <select>
                <option>À vista</option>
                <option>Carteira</option>
            </select>
        </div>
    </div>

    <!-- ALERTA PAGAMENTO -->
    <div style="margin-bottom: 10px; padding: 8px; border-radius: 6px; background: #e8f5e9;">
        🟢 Venda à vista: será quitada agora
    </div>
<div id="avisoErro" class="aviso-erro"></div>
    <!-- LINHA DE DIGITAÇÃO -->
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <input id="produto" placeholder="Produto" list="lista-produtos" style="flex:2;" autofocus>
<datalist id="lista-produtos">
</datalist>
        <input placeholder="Qtd" style="width:80px;">
        <input placeholder="Preço" style="width:120px;">
        <div style="flex:1; color: green;">Margem: +30%</div>
    </div>

    <!-- TABELA -->
    <div style="flex:1; overflow:auto; border:1px solid #ccc;">
        <table style="width:100%;">
    <thead>
        <tr style="background:#f5f5f5;">
            <th>Produto</th>
            <th>Qtd</th>
            <th>Preço</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody id="itens-venda"></tbody>
</table>
    </div>

    <!-- RODAPÉ -->
    <div style="margin-top: 10px; display: flex; justify-content: space-between;">
    <div id="total-itens">Total itens: 0</div>
    <div id="total-geral" style="font-size: 20px; font-weight: bold;">R$ 0,00</div>
</div>

</div>
<script>
var produto = document.getElementById('produto');
var qtd = document.querySelector('input[placeholder="Qtd"]');
var preco = document.querySelector('input[placeholder="Preço"]');
var itensVenda = document.getElementById('itens-venda');
var totalItens = document.getElementById('total-itens');
var totalGeral = document.getElementById('total-geral');
var listaProdutos = document.getElementById('lista-produtos');
var avisoErro = document.getElementById('avisoErro');

function mostrarErro(msg) {
    avisoErro.textContent = msg;
    avisoErro.style.display = 'block';

    setTimeout(function() {
        avisoErro.style.display = 'none';
    }, 2000);
}

function esconderErro() {
    avisoErro.style.display = 'none';
}

var produtosMock = [
    'Arroz',
    'Feijão',
    'Macarrão',
    'Óleo',
    'Açúcar',
    'Café',
    'Skol lata 269',
    'Skol lata 350',
    'Skol 600',
    'Skol litrão'
];

produtosMock.forEach(function(nome) {
    var option = document.createElement('option');
    option.value = nome;
    listaProdutos.appendChild(option);
});

var quantidadeItens = 0;
var somaTotal = 0;

produto.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();

        var nomeProduto = produto.value.trim();

        if (!nomeProduto) {
            mostrarErro('Digite um produto.');
            produto.focus();
            return;
        }

        var produtoExiste = produtosMock.includes(nomeProduto);

        if (!produtoExiste) {
            mostrarErro('Produto não cadastrado.');
            produto.focus();
            produto.select();
            return;
        }

        qtd.value = '1';
qtd.focus();
qtd.select();
    }
});

qtd.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        preco.focus();
    }
});

qtd.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' && qtd.selectionStart === 0) {
        e.preventDefault();
        produto.focus();
    }
});

preco.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' && preco.selectionStart === 0) {
        e.preventDefault();
        qtd.focus();
    }
});

function adicionarItemVenda() {
    var nomeProduto = produto.value.trim();
    
var quantidade = parseFloat(String(qtd.value).replace(',', '.')) || 0;
var precoTexto = String(preco.value).trim();
if (precoTexto && !precoTexto.includes(',')) {
    precoTexto = precoTexto + ',00';
}
var valorPreco = parseFloat(precoTexto.replace(',', '.')) || 0;
preco.value = precoTexto;

if (!nomeProduto) {
    produto.focus();
    return;
}
var produtoExiste = produtosMock.includes(nomeProduto);

if (!produtoExiste) {
    produto.focus();
    produto.select();
    return;
}
if (quantidade <= 0) {
    qtd.focus();
    qtd.select();
    return;
}

if (valorPreco <= 0) {
    preco.focus();
    preco.select();
    return;
}
    var total = quantidade * valorPreco;

    itensVenda.insertAdjacentHTML('beforeend',
        '<tr>' +
            '<td>' + nomeProduto + '</td>' +
            '<td>' + quantidade + '</td>' +
            '<td>R$ ' + valorPreco.toFixed(2) + '</td>' +
            '<td>R$ ' + total.toFixed(2) + '</td>' +
        '</tr>'
    );

    quantidadeItens += 1;
    somaTotal += total;

    totalItens.textContent = 'Total itens: ' + quantidadeItens;
    totalGeral.textContent = 'R$ ' + somaTotal.toFixed(2);

    var produtosOrdenados = [...produtosMock].sort(function(a, b) {
    return a.localeCompare(b, 'pt-BR');
});
var indiceAtual = produtosOrdenados.indexOf(nomeProduto);
var proximoProduto = indiceAtual >= 0 && indiceAtual < produtosOrdenados.length - 1
    ? produtosOrdenados[indiceAtual + 1]
    : produtosOrdenados[0];

produto.value = proximoProduto;
    qtd.value = '';
    preco.value = '';
esconderErro();
    requestAnimationFrame(function() {
    produto.focus();
    produto.select();
});
}

preco.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        adicionarItemVenda();
    }
});
</script>
{% endblock %}
