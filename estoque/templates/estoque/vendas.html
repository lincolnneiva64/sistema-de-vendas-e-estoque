<script>
  const tbody = document.getElementById("itens-venda");

  tbody.addEventListener("click", function (e) {
    const tr = e.target.closest("tr");
    if (!tr) return;

    // remove seleção anterior
    document.querySelectorAll("#tabela-venda tbody tr")
      .forEach(row => row.classList.remove("selecionado"));

    // adiciona nova seleção
itemSelecionadoId = Number(tr.dataset.id);
tr.classList.add("selecionado");
});
  document.addEventListener("keydown", function (e) {
  const linhas = document.querySelectorAll("#tabela-venda tbody tr");
  const selecionado = document.querySelector("#tabela-venda tbody tr.selecionado");

  if (!linhas.length) return;

  let index = Array.from(linhas).indexOf(selecionado);

  if (e.key === "ArrowDown") {
    e.preventDefault();
    index = (index + 1) % linhas.length;
  }

  if (e.key === "ArrowUp") {
    e.preventDefault();
    index = (index - 1 + linhas.length) % linhas.length;
  }

  linhas.forEach(l => l.classList.remove("selecionado"));
  linhas[index].classList.add("selecionado");
});
</script>

<script>
let itensVenda = []
var produto = document.getElementById('produto');
var qtd = document.querySelector('input[placeholder="Qtd"]');
var preco = document.querySelector('input[placeholder="Preço"]');
var itensTabela = document.getElementById('itens-venda');
var totalItens = document.getElementById('total-itens');
var totalGeral = document.getElementById('total-geral');
var btnFinalizarVenda = document.getElementById('btn-finalizar-venda');
var modalFinalizacao = document.getElementById('modal-finalizacao');
var modalFinalizacaoTotal = document.getElementById('modal-finalizacao-total');
var btnModalFinalizacaoOk = document.getElementById('btn-modal-finalizacao-ok');
var btnModalFinalizacaoContinuar = document.getElementById('btn-modal-finalizacao-continuar');
var listaProdutos = document.getElementById('lista-produtos');
var avisoErro = document.getElementById('avisoErro');
var avisoErroMensagem = document.getElementById('avisoErroMensagem');
var avisoErroAcoes = document.getElementById('avisoErroAcoes');
var btnAvisoCancelar = document.getElementById('btnAvisoCancelar');
var btnAvisoIncluir = document.getElementById('btnAvisoIncluir');
function mostrarErro(msg, comAcoes = false) {
    avisoErroMensagem.textContent = msg;
    avisoErro.style.display = 'block';

    if (comAcoes) {
        avisoErroAcoes.style.display = 'inline-block';
    } else {
        avisoErroAcoes.style.display = 'none';
    }
}

function esconderErro() {
    avisoErro.style.display = 'none';
}

var produtosMock = [
    'Arroz',
    'Feijão',
    'Macarrão',
    'Óleo',
    'Açúcar',
    'Café',
    'Skol lata 269',
    'Skol lata 350',
    'Skol 600',
    'Skol litrão'
];

produtosMock.forEach(function(nome) {
    var option = document.createElement('option');
    option.value = nome;
    listaProdutos.appendChild(option);
});

var quantidadeItens = 0;
var somaTotal = 0;
produto.addEventListener('input', function() {
    esconderErro();
});
produto.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();

        var nomeProduto = produto.value.trim();

        if (!nomeProduto) {
            mostrarErro('Digite um produto.');
            produto.focus();
            return;
        }

        var nomeProdutoNormalizado = nomeProduto.toLowerCase();
var nomeProdutoOficial = produtosMock.find(function(item) {
    return item.toLowerCase() === nomeProdutoNormalizado;
});
var produtoExiste = !!nomeProdutoOficial;

if (!produtoExiste) {
    mostrarErro('Produto não cadastrado.');
    produto.focus();
    produto.select();
    return;
}

var produtoJaLancado = itensVenda.some(function(item) {
    return item.produto.toLowerCase() === nomeProdutoOficial.toLowerCase();
});
if (!produtoJaLancado) {
    qtd.value = 1;
    qtd.focus();
    qtd.select();
            return;
}


if (produtoJaLancado) {
    mostrarErro('Produto já lançado. Deseja incluir novamente?', true);
btnAvisoCancelar.focus();

btnAvisoCancelar.onkeydown = function(e) {
    if (e.key === 'ArrowRight') {
        e.preventDefault();
        btnAvisoIncluir.focus();
    }

    if (e.key === 'Enter') {
        e.preventDefault();
        btnAvisoCancelar.click();
    }

    if (e.key === 'Escape') {
        e.preventDefault();
        btnAvisoCancelar.click();
    }
};

btnAvisoIncluir.onkeydown = function(e) {
    if (e.key === 'ArrowLeft') {
        e.preventDefault();
        btnAvisoCancelar.focus();
    }

    if (e.key === 'Enter') {
        e.preventDefault();
        btnAvisoIncluir.click();
    }

    if (e.key === 'Escape') {
        e.preventDefault();
        btnAvisoCancelar.click();
    }
};
btnAvisoCancelar.onclick = function() {
    esconderErro();
    produto.focus();
    produto.select();
};

btnAvisoIncluir.onclick = function() {
    esconderErro();

    produto.value = nomeProdutoOficial;
    qtd.value = '1';
    qtd.focus();
    qtd.select();
};

return;
}
produto.value = nomeProdutoOficial;
        qtd.value = '1';
qtd.focus();
qtd.select();
    }
});

qtd.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        preco.focus();
    }
});

qtd.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' && qtd.selectionStart === 0) {
        e.preventDefault();
        produto.focus();
    }
});

preco.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' && preco.selectionStart === 0) {
        e.preventDefault();
        qtd.focus();
    }
});
var itemSelecionadoId = null;
function renderizarItensVenda() {
    itensTabela.innerHTML = '';

    var quantidadeItens = itensVenda.length;
    var somaTotal = 0;

    itensVenda.forEach(function(item) {
        somaTotal += item.total;

        itensTabela.insertAdjacentHTML('beforeend',
            '<tr data-id="' + item.id + '" class="' + (item.id === itemSelecionadoId ? 'selecionado' : '') + '">' +
                '<td>' + item.produto + '</td>' +
                '<td>' + item.quantidade + '</td>' +
                '<td>R$ ' + item.preco.toFixed(2) + '</td>' +
                '<td>R$ ' + item.total.toFixed(2) + '</td>' +
            '</tr>'
        );
    });

    totalItens.textContent = 'Total itens: ' + quantidadeItens;
    totalGeral.textContent = 'R$ ' + somaTotal.toFixed(2);
}
function adicionarItemVenda() {
    var nomeProduto = produto.value.trim();
    
var quantidade = parseFloat(String(qtd.value).replace(',', '.')) || 0;
var precoTexto = String(preco.value).trim();
if (precoTexto && !precoTexto.includes(',')) {
    precoTexto = precoTexto + ',00';
}
var valorPreco = parseFloat(precoTexto.replace(',', '.')) || 0;
preco.value = precoTexto;

if (!nomeProduto) {
    produto.focus();
    return;
}
var nomeProdutoNormalizado = nomeProduto.toLowerCase();
var nomeProdutoOficial = produtosMock.find(function(item) {
    return item.toLowerCase() === nomeProdutoNormalizado;
});
var produtoExiste = !!nomeProdutoOficial;

if (!produtoExiste) {
    produto.focus();
    produto.select();
    return;
}
if (quantidade <= 0) {
    qtd.focus();
    qtd.select();
    return;
}

if (valorPreco <= 0) {
    preco.focus();
    preco.select();
    return;
}
    var total = quantidade * valorPreco;

var itemVenda = {
  id: Date.now() + Math.random(),
  produto: nomeProdutoOficial,
  quantidade: quantidade,
  preco: valorPreco,
  total: total
};
itensVenda.push(itemVenda);
itemSelecionadoId = itemVenda.id;
renderizarItensVenda();
    var produtosOrdenados = [...produtosMock].sort(function(a, b) {
    return a.localeCompare(b, 'pt-BR');
});
var indiceAtual = produtosOrdenados.indexOf(nomeProduto);
var proximoProduto = indiceAtual >= 0 && indiceAtual < produtosOrdenados.length - 1
    ? produtosOrdenados[indiceAtual + 1]
    : produtosOrdenados[0];

produto.value = proximoProduto;
    qtd.value = '';
    preco.value = '';
esconderErro();
    requestAnimationFrame(function() {
    produto.focus();
    produto.select();
});
}

preco.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        adicionarItemVenda();
    }
});
function abrirModalFinalizacao(totalVenda) {
    modalFinalizacaoTotal.textContent = 'Total da venda: R$ ' + totalVenda.toFixed(2);
    modalFinalizacao.style.display = 'block';
}

function fecharModalFinalizacao() {
    modalFinalizacao.style.display = 'none';
}
btnFinalizarVenda.onclick = function() {
    var totalVenda = itensVenda.reduce(function(soma, item) {
        return soma + item.total;
    }, 0);

    if (itensVenda.length === 0) {
        produto.focus();
        return;
    }

    abrirModalFinalizacao(totalVenda);
};
btnModalFinalizacaoContinuar.onclick = function() {
    fecharModalFinalizacao();

    requestAnimationFrame(function() {
        produto.focus();
    });
};
btnModalFinalizacaoOk.onclick = function() {
    fecharModalFinalizacao();

    itensVenda = [];

    renderizarItensVenda();

    produto.value = '';
    qtd.value = '';
    preco.value = '';

    esconderErro();

    requestAnimationFrame(function() {
        produto.focus();
    });
    };
    document.addEventListener('keydown', function(e) {
    if (modalFinalizacao.style.display === 'block') {

        if (e.key === 'ArrowRight') {
            e.preventDefault();
            btnModalFinalizacaoOk.focus();
        }

        if (e.key === 'ArrowLeft') {
            e.preventDefault();
            btnModalFinalizacaoContinuar.focus();
        }

        if (e.key === 'Enter') {
            e.preventDefault();

            if (document.activeElement === btnModalFinalizacaoContinuar) {
                btnModalFinalizacaoContinuar.click();
                return;
            }

            btnModalFinalizacaoOk.click();
        }
if (e.key === 'Escape') {
    e.preventDefault();
    btnModalFinalizacaoContinuar.click();
}
    }
});
</script>
