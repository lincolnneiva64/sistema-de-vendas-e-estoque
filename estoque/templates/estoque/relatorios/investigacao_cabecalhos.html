<thead><tr>{% for coluna in cabecalhos_ordenacao %}<th scope="col"{% if coluna.ativo %} aria-sort="{{ coluna.aria }}"{% endif %}><a href="{{ coluna.url }}" data-ordenacao-link data-coluna="{{ coluna.chave }}" aria-label="Ordenar por {{ coluna.rotulo }}{% if coluna.ativo %}, inverter ordem{% endif %}">{{ coluna.rotulo }}{% if coluna.ativo %} <span aria-hidden="true">{{ coluna.seta }}</span>{% endif %}</a></th>{% endfor %}</tr></thead>
