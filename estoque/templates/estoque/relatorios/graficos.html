{% load l10n relatorios %}
<div class="relatorios-graficos{% if produto_relatorio %} produto-graficos{% endif %}">
  <figure class="relatorios-grafico grafico-evolucao" id="evolucao-vendas" aria-labelledby="titulo-evolucao-vendas">
    {% with analise=resumo.analise_evolucao %}
    <h2 id="titulo-evolucao-vendas" tabindex="-1">Evolução das vendas</h2>
    {% include 'estoque/relatorios/evolucao_controles.html' %}
    {% if evolucao_invalida %}<p class="relatorios-aviso" role="alert">Corrija as opções de análise indicadas acima e clique em Comparar. O gráfico não foi atualizado; os cartões mantêm o filtro de faturamento.</p>{% else %}
    <figcaption>{% if analise.historico %}{{ analise.inicio|date:'d/m/Y' }} a {{ analise.fim|date:'d/m/Y' }} · Histórico independente dos cartões{% elif resumo.grafico_evolucao.par_mensal %}Comparação parcial equivalente · {{ analise.equivalente.anterior_inicio|date:'d/m/Y' }} a {{ analise.equivalente.anterior_fim|date:'d/m/Y' }} versus {{ analise.equivalente.atual_inicio|date:'d/m/Y' }} a {{ analise.equivalente.atual_fim|date:'d/m/Y' }}{% else %}{{ inicio|date:'d/m/Y' }} até {{ fim|date:'d/m/Y' }} · Todo o intervalo selecionado{% endif %}</figcaption>
    {% if not analise.comparavel and not analise.comparacao_disponivel and not analise.cobertura_mensal %}<p class="grafico-vazio">Sem período comparável</p>{% endif %}
    {% with dados=resumo.grafico_evolucao|default:analise %}{{ dados|json_grafico:'relatorios-barras-dados' }}{% endwith %}
    <div id="relatorios-barras" hidden>
      {% if analise.modo == 'mensal' %}
      <div class="grafico-legenda-mensal" aria-label="Legenda das barras mensais">
        <span><i class="amostra-barra-real" aria-hidden="true"></i>Barra sólida: {% if produto_relatorio and medida == 'quantidade' %}Quantidade realizada ({{ unidade }}).{% elif produto_relatorio and medida == 'vendas' %}Vendas realizadas.{% else %}Faturamento realizado.{% endif %}</span>
        <span><i class="amostra-barra-fantasma" aria-hidden="true"></i>Barra fantasma: Previsão de fechamento ou equivalente teórico.</span>
        <p>A barra fantasma representa uma estimativa baseada no ritmo médio diário {% if produto_relatorio and medida == 'quantidade' %}da quantidade em {{ unidade }}.{% elif produto_relatorio and medida == 'vendas' %}do número de vendas.{% else %}de faturamento. O ticket médio é apresentado como indicador complementar.{% endif %} Valores estimados não representam vendas realizadas.</p>
      </div>
      {% endif %}
      <div class="grafico-barras-janela" role="region" aria-label="{% if produto_relatorio %}Evolução comercial do produto{% else %}Faturamento{% endif %} por período em barras; use a rolagem horizontal para ler os períodos" tabindex="0">
        <div class="grafico-barras-plot"><ol class="grafico-barras-lista"></ol><div class="grafico-media-linha" aria-hidden="true"></div><div class="grafico-zero-linha" hidden aria-hidden="true"></div></div>
      </div>
      <nav class="grafico-barras-controles" aria-label="Períodos do gráfico">
        <button type="button" data-barras-anterior>Anterior</button>
        <span data-barras-intervalo role="status"></span>
        <button type="button" data-barras-proximo>Próximos períodos</button>
      </nav>
    </div>
    {% if produto_relatorio %}<details class="indicadores-metodo"><summary>Como foi calculado</summary>{% endif %}
    {% if analise.historico or analise.cobertura_mensal %}<p class="grafico-nota">{% if analise.cobertura_comercial %}Cobertura baseada nos documentos comerciais de todos os produtos, com totais completos. Dias cobertos sem venda deste produto ou unidade entram como zero; dias sem cobertura permanecem desconhecidos. {% endif %}Sem registros: sem histórico suficiente, nunca zero presumido. Totais ausentes interrompem a comparação. Os documentos disponíveis não certificam a completude de arquivos antigos. {% if analise.inicio_registros %}Primeiro registro preservado: {{ analise.inicio_registros|date:'d/m/Y' }}; isso não comprova a data real de início do sistema. A comparação mensal exige registros válidos em todos os dias dos dois intervalos; dias sem registro não são presumidos como zero.{% endif %} {% if analise.comparacao_mensal == 'ano_anterior' %}Meses comparados ao mesmo mês do ano anterior.{% endif %}</p>{% endif %}
    {% if not resumo.grafico_evolucao.par_mensal and not analise.historico and not analise.cobertura_mensal %}<p class="grafico-nota"><strong>{{ analise.titulo }}</strong>. {% if analise.media != None %}<span class="grafico-media-legenda" aria-hidden="true"></span>Média dos períodos completos: <strong>{{ analise.media|valor_evolucao:analise }}</strong> ({{ analise.quantidade_completos }}).{% else %}Sem períodos completos para calcular a média.{% endif %} Inclui ocorrências sem vendas como zero; períodos parciais ficam fora da média{% if analise.modo != 'semanal' and not analise.equivalente %} e da variação{% endif %}.</p>{% endif %}
    {% if resumo.grafico_evolucao.inicio_parcial_oculto %}<p class="grafico-nota">O início parcial do mês permanece nos totais e no detalhamento diário; as barras começam na primeira segunda-feira.</p>{% endif %}
    <noscript><p>O gráfico requer JavaScript. Os valores estão disponíveis na tabela diária abaixo.</p></noscript>
    <p class="grafico-nota">{% if analise.historico or analise.cobertura_mensal %}{{ analise.titulo }}. Períodos completos comparam calendários completos; parciais usam as mesmas datas da referência. Semanas seguem de segunda a domingo, mesmo na virada do mês. No diário, todos os dias comparam o dia anterior; um dia da semana compara sete dias antes. Hoje não tem comparação diária intradia. {% if analise.media != None %}Média dos períodos completos com histórico: {{ analise.media|valor_evolucao:analise }}.{% endif %}{% elif analise.modo == 'semanal' %}Semanas de segunda a domingo. Diferença em reais e percentual contra a semana imediatamente anterior. Semanas completas comparam sete dias; parciais comparam somente os mesmos dias da semana anterior e são identificadas separadamente. Hoje ainda está em andamento; datas futuras ficam fora da evolução transcorrida. Com faturamento anterior zero ou negativo, o percentual não é calculável. A referência anterior pode anteceder o filtro e não altera os cartões nem o detalhamento diário.{% elif analise.equivalente %}A comparação parcial equivalente usa os mesmos dias do mês anterior, mesmo fora do filtro, sem alterar os indicadores principais.{% else %}Variação em relação ao período anterior completo e consecutivo. Com anterior zero, negativo ou parcial: Sem período comparável. Hoje e períodos ainda não encerrados são parciais.{% endif %} <a href="#evolucao-diaria">Ver detalhamento diário</a>.</p>
    {% if produto_relatorio %}<p class="grafico-nota">A quantidade usa apenas a unidade comercial escolhida, sem conversão pelo cadastro atual. Dias com cobertura comercial comprovada entram na média mesmo sem venda do produto, como zero. Dias sem cobertura permanecem desconhecidos. As estimativas não entram nos totais realizados.</p></details>{% endif %}
    {% if analise.equivalente %}<section class="evolucao-equivalente"><h3>Comparação parcial equivalente</h3>
      {% if analise.equivalente.motivo %}<p>Sem período comparável. {{ analise.equivalente.motivo }}</p>{% else %}
      <noscript><p>{{ analise.equivalente.atual_inicio|date:'d/m/Y' }} a {{ analise.equivalente.atual_fim|date:'d/m/Y' }}: <strong>{{ analise.equivalente.atual|valor_evolucao:analise }}</strong></p>
      <p>{{ analise.equivalente.anterior_inicio|date:'d/m/Y' }} a {{ analise.equivalente.anterior_fim|date:'d/m/Y' }}: <strong>{{ analise.equivalente.anterior|valor_evolucao:analise }}</strong></p></noscript>
      <p class="{% if analise.equivalente.diferenca > 0 %}crescimento{% elif analise.equivalente.diferenca < 0 %}queda{% endif %}">Diferença: <strong class="comparacao-valor">{{ analise.equivalente.diferenca|valor_sinal_evolucao:analise }}</strong>. {% if analise.equivalente.variacao != None %}Variação: <strong class="comparacao-valor">{{ analise.equivalente.variacao|numero_sinal_br }}%</strong>.{% else %}Percentual não calculável: faturamento anterior zero ou negativo.{% endif %}</p>
      <p class="grafico-nota">Comparação parcial equivalente. {% if analise.equivalente.inclui_hoje %}Hoje ainda está em andamento. {% endif %}A referência anterior não altera os cartões nem a tabela diária do intervalo.</p>
      {% endif %}</section>{% endif %}
    {% endif %}
    {% endwith %}
  </figure>
  {% if not produto_relatorio %}
  <figure class="relatorios-grafico grafico-participacao">
    <h2>Participação no faturamento</h2>
    <figcaption>Percentuais sobre o faturamento comercial do período.</figcaption>
    {% if resumo.participacao_disponivel %}
    <div class="grafico-partes" role="img" aria-label="{% for item in resumo.participacoes %}{{ item.rotulo }}: {{ item.percentual|numero_br }}%. {% endfor %}">
      {% for item in resumo.participacoes %}{% if item.valor > 0 %}<span class="parte-{{ item.chave }}" style="flex-grow:{{ item.valor|unlocalize }}"></span>{% endif %}{% endfor %}
    </div>
    {% else %}<p class="grafico-vazio">Sem base positiva para representar a participação.</p>{% endif %}
    <ul class="grafico-legenda">
      {% for item in resumo.participacoes %}<li><span class="legenda-cor parte-{{ item.chave }}" aria-hidden="true"></span><span>{{ item.rotulo }}</span><strong>{{ item.percentual|numero_br }}%</strong><span>{{ item.valor|moeda_br }}</span></li>{% endfor %}
    </ul>
  </figure>
  {% endif %}
</div>
