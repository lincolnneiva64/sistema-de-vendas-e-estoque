{% extends 'estoque/base.html' %}
{% block title %}Receber Cliente{% endblock %}
{% block content %}
<style>
  html,
  body,
  main,
  .content,
  .container {
    background: #fff6d8 !important;
  }

  body {
    background: #fff6d8 !important;
  }

  .receber-escolher-shell {
    max-width: 940px;
    margin: 28px auto 0;
    padding: 0 18px;
    font-family: Arial, sans-serif;
  }

  .receber-escolher-card {
    background: transparent;
    border: 0;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }

  .receber-escolher-topo {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 16px;
  }

  .receber-escolher-title {
    margin: 0;
    color: #071f49;
    font-size: 26px;
    line-height: 1.15;
    font-weight: 900;
  }

  .receber-escolher-subtitle {
    margin: 6px 0 0;
    color: #5e7290;
    font-size: 15px;
    line-height: 1.35;
    font-weight: 700;
  }

  .receber-escolher-voltar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 86px;
    height: 46px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid #b8cff2;
    background: #eef5ff;
    color: #123d7c;
    text-decoration: none;
    font-size: 15px;
    font-weight: 900;
  }

  .receber-escolher-voltar:hover {
    background: #e4efff;
  }

  .receber-escolher-wrap {
    position: relative;
    background: #ffffff;
    border: 1px solid #d7e1ee;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 8px 20px rgba(15, 35, 69, 0.04);
  }

  .receber-escolher-label {
    display: block;
    margin: 0 0 8px;
    color: #526782;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .receber-escolher-input {
    width: 100%;
    height: 52px;
    border-radius: 10px;
    border: 1.5px solid #c9d7e8;
    background: #ffffff;
    color: #111827;
    font-size: 17px;
    font-weight: 700;
    padding: 0 14px;
    outline: none;
  }

  .receber-escolher-input::placeholder {
    color: #7b8798;
    font-weight: 700;
  }

  .receber-escolher-input:focus {
    border-color: #6fa3ff;
    box-shadow: 0 0 0 3px rgba(111, 163, 255, 0.12);
  }

  .receber-escolher-sugestoes {
    display: none;
    position: absolute;
    z-index: 50;
    top: 82px;
    left: 14px;
    right: 14px;
    max-height: 330px;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid #bfd5fb;
    border-radius: 12px;
    box-shadow: 0 12px 24px rgba(15, 35, 69, 0.12);
  }

  .receber-escolher-sugestoes::-webkit-scrollbar {
    width: 9px;
  }

  .receber-escolher-sugestoes::-webkit-scrollbar-thumb {
    background: #c7d6ee;
    border-radius: 999px;
  }

  .receber-escolher-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    font-size: 16px;
    font-weight: 800;
    color: #172033;
    cursor: pointer;
    border-bottom: 1px solid #edf2f7;
  }

  .receber-escolher-item:last-child {
    border-bottom: 0;
  }

  .receber-escolher-item:hover {
    background: #f4f8ff;
  }

  .receber-escolher-item.ativo {
    background: #2563eb;
    color: #ffffff;
  }

  .receber-escolher-meta {
    color: #66758a;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
  }

  .receber-escolher-item.ativo .receber-escolher-meta {
    color: rgba(255,255,255,0.92);
  }

  .receber-escolher-aviso {
    margin: 12px 0 0;
    color: #99520e;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.35;
  }

  @media (max-width: 700px) {
    .receber-escolher-shell {
      margin-top: 18px;
      padding: 0 12px;
    }

    .receber-escolher-topo {
      margin-bottom: 12px;
    }

    .receber-escolher-title {
      font-size: 24px;
    }

    .receber-escolher-subtitle {
      font-size: 14px;
    }

    .receber-escolher-voltar {
      min-width: 78px;
      height: 42px;
      font-size: 14px;
    }

    .receber-escolher-wrap {
      padding: 12px;
      border-radius: 12px;
    }

    .receber-escolher-input {
      height: 50px;
      font-size: 16px;
    }

    .receber-escolher-sugestoes {
      top: 78px;
      left: 12px;
      right: 12px;
    }
  }
</style>

<div class="receber-escolher-shell">
  <section class="receber-escolher-card">
    <header class="receber-escolher-topo">
      <div>
        <h1 class="receber-escolher-title">Receber Cliente</h1>
        <p class="receber-escolher-subtitle">Escolha o cliente para abrir direto a tela de recebimento.</p>
      </div>
      <a href="{{ retorno_url }}" class="receber-escolher-voltar">Voltar</a>
    </header>

    <label for="clienteBuscaReceber" class="receber-escolher-label">Cliente</label>
    <div class="receber-escolher-wrap">
      <input id="clienteBuscaReceber" class="receber-escolher-input" type="text" autocomplete="off" placeholder="Digite nome, apelido ou WhatsApp">
      <div id="clienteSugestoesReceber" class="receber-escolher-sugestoes"></div>
    </div>

    <div class="receber-escolher-aviso">Ao selecionar o cliente, o sistema abre a tela completa de recebimento dele.</div>
  </section>
</div>

<script>
(function () {
  const input = document.getElementById("clienteBuscaReceber");
  const box = document.getElementById("clienteSugestoesReceber");
  const clientesUrl = "{% url 'estoque:clientes_autocomplete' %}";
  const receberUrlBase = "{% url 'estoque:receber_cliente' 0 %}";
  const retornoUrl = "{% url 'estoque:receber_cliente_escolher' %}";
  let clientes = [];
  let timer = null;
  let indiceAtivo = -1;
  let ultimoTermo = "";

  function abrirRecebimento(cliente) {
    if (!cliente || !cliente.id) return;
    const url = receberUrlBase.replace("/cliente/0/", "/cliente/" + encodeURIComponent(cliente.id) + "/")
      + "?next=" + encodeURIComponent(retornoUrl);
    window.location.href = url;
  }

  function normalizarTexto(valor) {
    return String(valor || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim();
  }

  function iniciais(nome) {
    return normalizarTexto(nome)
      .split(/\s+/)
      .filter(Boolean)
      .map((parte) => parte[0])
      .join("");
  }

  function prioridadeCliente(cliente, termo) {
    const busca = normalizarTexto(termo);
    const nome = normalizarTexto(cliente.nome);
    const telefone = normalizarTexto(cliente.whatsapp || cliente.telefone || "");

    if (!busca) return 9;
    if (nome.startsWith(busca)) return 0;
    if (nome.includes(busca)) return 1;
    if (telefone.includes(busca)) return 2;
    return 9;
  }

  function ordenarClientes(lista, termo) {
    const busca = normalizarTexto(termo);
    const todos = (lista || []).slice();

    const comecoNome = todos.filter((cliente) =>
      normalizarTexto(cliente.nome).startsWith(busca)
    );

    const base = comecoNome.length
      ? comecoNome
      : todos.filter((cliente) => prioridadeCliente(cliente, termo) < 9);

    return base.sort((a, b) =>
      normalizarTexto(a.nome).localeCompare(
        normalizarTexto(b.nome),
        "pt-BR"
      )
    );
  }

  function rolarItemAtivoParaVisivel() {
    const item = box.querySelector(".receber-escolher-item.ativo");
    if (!item) return;
    item.scrollIntoView({ block: "nearest" });
  }

  function renderizar() {
    box.innerHTML = "";

    if (!clientes.length) {
      box.style.display = "none";
      indiceAtivo = -1;
      return;
    }

    clientes.forEach((cliente, index) => {
      const item = document.createElement("div");
      item.className = "receber-escolher-item" + (index === indiceAtivo ? " ativo" : "");
      item.innerHTML = `<span>${cliente.nome || ""}</span><span class="receber-escolher-meta">${cliente.whatsapp || cliente.telefone || ""}</span>`;

      item.addEventListener("mouseenter", () => {
        indiceAtivo = index;
        renderizar();
      });

      item.addEventListener("click", () => abrirRecebimento(cliente));
      box.appendChild(item);
    });

    box.style.display = "block";
    rolarItemAtivoParaVisivel();
  }

  function buscarClientes() {
    const termo = input.value.trim();
    ultimoTermo = termo;

    if (termo.length < 2) {
      clientes = [];
      renderizar();
      return;
    }

    fetch(clientesUrl + "?contexto=receber_rapido&q=" + encodeURIComponent(termo), {
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
      .then((resposta) => resposta.ok ? resposta.json() : Promise.reject())
      .then((dados) => {
        if (input.value.trim() !== ultimoTermo) return;
        clientes = ordenarClientes(dados.clientes || [], termo);
        indiceAtivo = clientes.length ? 0 : -1;
        renderizar();
      })
      .catch(() => {
        clientes = [];
        indiceAtivo = -1;
        renderizar();
      });
  }

  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(buscarClientes, 120);
  });

  input.addEventListener("keydown", (event) => {
    if (!clientes.length) return;

    if (event.key === "ArrowDown") {
      event.preventDefault();
      indiceAtivo = Math.min(indiceAtivo + 1, clientes.length - 1);
      renderizar();
      return;
    }

    if (event.key === "ArrowUp") {
      event.preventDefault();
      indiceAtivo = Math.max(indiceAtivo - 1, 0);
      renderizar();
      return;
    }

    if (event.key === "Enter") {
      event.preventDefault();
      abrirRecebimento(clientes[indiceAtivo >= 0 ? indiceAtivo : 0]);
      return;
    }

    if (event.key === "Escape") {
      clientes = [];
      indiceAtivo = -1;
      renderizar();
    }
  });

  setTimeout(() => input.focus(), 100);
})();
</script>
{% endblock %}
