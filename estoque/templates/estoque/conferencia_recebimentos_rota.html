<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferencia de Recebimentos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f6f8fb;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }
    .conf-page {
      min-height: 100vh;
      padding: 16px;
    }
    .conf-shell {
      width: min(860px, 100%);
      margin: 0 auto;
    }
    .conf-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .conf-title {
      margin: 0;
      font-size: 1.55rem;
      line-height: 1.15;
    }
    .conf-subtitle {
      margin: 6px 0 0;
      color: #637083;
      font-weight: 700;
    }
    .conf-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #0f766e;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }
    .conf-btn:hover,
    .conf-btn:focus {
      background: #115e59;
    }
    @media (max-width: 720px) {
      .conf-top { display: block; }
      .conf-btn {
        width: 100%;
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="conf-page">
    <div class="conf-shell">
      <header class="conf-top">
        <div>
          <h1 class="conf-title">Conferência de Recebimentos</h1>
          {% if rota_filtro %}
            <p class="conf-subtitle">{{ rota_filtro }} - {{ data_referencia|date:"d/m/Y" }}</p>
          {% endif %}
        </div>
        <a class="conf-btn" href="{{ voltar_url }}">Voltar</a>
      </header>
    </div>
  </main>
</body>
</html>
