<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <span class="navbar-brand fw-semibold">Meia Meia</span>
        <div class="ms-auto">
            <a class="btn btn-primary" href="{% url 'estoque:home' %}">Voltar</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="p-4 bg-white border rounded-3">
        <h2 class="h4 mb-3">Detalhes do Produto</h2>

        <p><strong>Nome:</strong> {{ produto.nome }}</p>
        <p><strong>Código:</strong> {{ produto.codigo }}</p>
        <p><strong>Categoria:</strong> {{ produto.categoria }}</p>
        <p><strong>Preço:</strong> {{ produto.preco }}</p>
        <p><strong>Quantidade:</strong> {{ produto.quantidade }}</p>
        <p><strong>Fornecedor:</strong> {{ produto.fornecedor }}</p>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
