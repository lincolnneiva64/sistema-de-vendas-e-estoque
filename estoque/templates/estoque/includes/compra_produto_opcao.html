<option value="{{ produto.id }}" data-grupo-id="{{ produto.vinculo_grupo.grupo_id }}" data-grupo-url="{% if produto.vinculo_grupo %}{% url 'estoque:grupos_produtos_detalhe' produto.vinculo_grupo.grupo_id %}{% endif %}" data-grupo-precos="{{ produto.vinculo_grupo.grupo.nome }}" data-grupo-regularizado="{% if produto.vinculo_grupo.grupo.precos_regularizados %}1{% else %}0{% endif %}" data-versao-grupo="{{ produto.vinculo_grupo.grupo.versao_precos }}" data-unidade="{{ produto.unidade_compra|default:'' }}" data-consulta-pc="{{ produto.preco_compra|default_if_none:'' }}" data-preco-compra="{{ produto.preco_compra|default:0|floatformat:2 }}" data-preco-compra-fracionado="{{ produto.preco_compra_fracionado|default:0|floatformat:2 }}" data-preco-venda="{{ produto.preco_venda|default:produto.preco_vista|default:0|floatformat:2 }}" data-preco-vista="{{ produto.preco_vista|default:produto.preco_venda|default:0|floatformat:2 }}" data-preco-prazo="{{ produto.preco_prazo|default:0|floatformat:2 }}" data-preco-vista-fracionado="{{ produto.preco_vista_fracionado|default:0|floatformat:2 }}" data-preco-prazo-fracionado="{{ produto.preco_prazo_fracionado|default:0|floatformat:2 }}" data-vende-fracionado="{% if produto.vende_fracionado %}1{% else %}0{% endif %}" data-fator-conversao="{{ produto.fator_conversao|default:0|floatformat:2 }}" data-estoque="{{ produto.quantidade|default:0 }}">{{ produto.nome }}</option>
