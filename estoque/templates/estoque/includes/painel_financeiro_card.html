<article class="financeiro-card {{ card.tipo }} {% if card.tipo == 'saldo' %}{% if card.valor < 0 %}valor-negativo{% else %}valor-positivo{% endif %}{% endif %}">
  <div class="financeiro-label">{{ card.titulo }}</div>
  <div class="financeiro-value">{% if card.valor_texto %}{{ card.valor_texto }}{% elif card.moeda == False %}{{ card.valor }}{% else %}R$ {{ card.valor|floatformat:2 }}{% endif %}</div>
</article>
