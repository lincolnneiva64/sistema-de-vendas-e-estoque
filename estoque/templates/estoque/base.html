{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16a34a">
    <title>{% block title %}Sistema de Vendas{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/estoque/pix-icon-192.svg">
    <link rel="apple-touch-icon" href="/static/estoque/pix-icon-192.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'estoque/home.css' %}">
    <style>
        .botao-voltar-topo {
            position: fixed;
            right: 16px;
            bottom: calc(22px + env(safe-area-inset-bottom));
            z-index: 999999;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 86px;
            min-height: 46px;
            border: 1px solid rgba(29, 78, 216, 0.38);
            border-radius: 999px;
            background: #0d6efd;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
            line-height: 1;
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.22);
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);
            transition: opacity 0.18s ease, transform 0.18s ease, background-color 0.18s ease, right 0.18s ease, min-width 0.18s ease, width 0.18s ease, border-radius 0.18s ease;
        }

        .botao-voltar-topo.visivel {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .botao-voltar-topo:hover,
        .botao-voltar-topo:focus {
            background: #0b5ed7;
            color: #ffffff;
        }

        .botao-voltar-topo:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.24), 0 10px 26px rgba(15, 23, 42, 0.22);
        }

        @media (max-width: 575.98px) {
            .botao-voltar-topo {
                right: 12px;
                bottom: calc(110px + env(safe-area-inset-bottom));
                min-width: 82px;
                min-height: 48px;
                padding: 0 14px;
                font-size: 0.9rem;
                opacity: 1;
                pointer-events: auto;
                transform: none;
            }

            .botao-voltar-topo.recolhido {
                right: 0;
                width: 34px;
                min-width: 34px;
                padding: 0;
                border-right: 0;
                border-radius: 999px 0 0 999px;
                box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
            }

            .botao-voltar-topo.recolhido .botao-voltar-topo-texto {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-light" style="padding-bottom: 16px;">

    {% block content %}{% endblock %}
    <button type="button" class="botao-voltar-topo" id="botao-voltar-topo" aria-label="Voltar ao topo" aria-expanded="false">
        <span aria-hidden="true">&uarr;</span>
        <span class="botao-voltar-topo-texto">Topo</span>
    </button>
    {% include "estoque/includes/ambiente_sistema.html" %}

    <script>
        (function () {
            const botao = document.getElementById("botao-voltar-topo");
            if (!botao) return;

            const limiteParaExibir = 260;
            const tempoParaRecolher = 3200;
            const consultaMobile = window.matchMedia("(max-width: 575.98px)");
            let temporizadorRecolher = null;

            function posicaoRolagemAtual() {
                const elementoRolagem = document.scrollingElement || document.documentElement || document.body;
                return Math.max(
                    window.pageYOffset || 0,
                    window.scrollY || 0,
                    elementoRolagem ? elementoRolagem.scrollTop || 0 : 0,
                    document.documentElement ? document.documentElement.scrollTop || 0 : 0,
                    document.body ? document.body.scrollTop || 0 : 0
                );
            }

            function atualizarBotaoTopo() {
                if (consultaMobile.matches) {
                    botao.classList.add("visivel");
                    return;
                }

                botao.classList.remove("recolhido");
                botao.setAttribute("aria-expanded", "false");
                botao.classList.toggle("visivel", posicaoRolagemAtual() > limiteParaExibir);
            }

            function cancelarRecolhimentoAgendado() {
                if (temporizadorRecolher) {
                    window.clearTimeout(temporizadorRecolher);
                    temporizadorRecolher = null;
                }
            }

            function recolherBotaoMobile() {
                if (!consultaMobile.matches) return;
                botao.classList.add("recolhido");
                botao.setAttribute("aria-expanded", "false");
            }

            function agendarRecolhimentoMobile() {
                cancelarRecolhimentoAgendado();
                if (!consultaMobile.matches) return;
                temporizadorRecolher = window.setTimeout(recolherBotaoMobile, tempoParaRecolher);
            }

            function expandirBotaoMobile() {
                if (!consultaMobile.matches) return;
                botao.classList.remove("recolhido");
                botao.setAttribute("aria-expanded", "true");
                agendarRecolhimentoMobile();
            }

            botao.addEventListener("click", function () {
                if (consultaMobile.matches && botao.classList.contains("recolhido")) {
                    expandirBotaoMobile();
                    return;
                }

                const elementoRolagem = document.scrollingElement || document.documentElement || document.body;

                if (elementoRolagem && typeof elementoRolagem.scrollTo === "function") {
                    elementoRolagem.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                }

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

                recolherBotaoMobile();
            });

            window.addEventListener("scroll", atualizarBotaoTopo, { passive: true });
            document.addEventListener("scroll", atualizarBotaoTopo, { passive: true, capture: true });
            document.addEventListener("touchmove", atualizarBotaoTopo, { passive: true });
            window.addEventListener("resize", atualizarBotaoTopo);
            if (typeof consultaMobile.addEventListener === "function") {
                consultaMobile.addEventListener("change", function () {
                    atualizarBotaoTopo();
                    recolherBotaoMobile();
                });
            }
            atualizarBotaoTopo();
            recolherBotaoMobile();
        })();
    </script>
</body>
</html>
