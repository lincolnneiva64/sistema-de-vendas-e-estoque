{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16a34a">
    <title>{% block title %}Sistema de Vendas{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/estoque/pix-icon-192.svg">
    <link rel="apple-touch-icon" href="/static/estoque/pix-icon-192.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'estoque/home.css' %}">
    <style>
        .botao-voltar-topo {
            position: fixed;
            right: max(18px, env(safe-area-inset-right));
            bottom: calc(22px + env(safe-area-inset-bottom));
            z-index: 1080;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 86px;
            min-height: 46px;
            border: 1px solid rgba(22, 101, 52, 0.28);
            border-radius: 999px;
            background: #16a34a;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
            line-height: 1;
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.22);
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);
            transition: opacity 0.18s ease, transform 0.18s ease, background-color 0.18s ease;
        }

        .botao-voltar-topo.visivel {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .botao-voltar-topo:hover,
        .botao-voltar-topo:focus {
            background: #15803d;
            color: #ffffff;
        }

        .botao-voltar-topo:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.24), 0 10px 26px rgba(15, 23, 42, 0.22);
        }

        @media (max-width: 575.98px) {
            .botao-voltar-topo {
                right: max(14px, env(safe-area-inset-right));
                bottom: calc(96px + env(safe-area-inset-bottom));
                min-width: 82px;
                min-height: 48px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body class="bg-light" style="padding-bottom: 16px;">

    {% block content %}{% endblock %}
    <button type="button" class="botao-voltar-topo" id="botao-voltar-topo" aria-label="Voltar ao topo">
        &uarr; Topo
    </button>
    {% include "estoque/includes/ambiente_sistema.html" %}

    <script>
        (function () {
            const botao = document.getElementById("botao-voltar-topo");
            if (!botao) return;

            const limiteParaExibir = 260;

            function posicaoRolagemAtual() {
                const elementoRolagem = document.scrollingElement || document.documentElement || document.body;
                return Math.max(
                    window.pageYOffset || 0,
                    window.scrollY || 0,
                    elementoRolagem ? elementoRolagem.scrollTop || 0 : 0,
                    document.documentElement ? document.documentElement.scrollTop || 0 : 0,
                    document.body ? document.body.scrollTop || 0 : 0
                );
            }

            function atualizarBotaoTopo() {
                botao.classList.toggle("visivel", posicaoRolagemAtual() > limiteParaExibir);
            }

            botao.addEventListener("click", function () {
                const elementoRolagem = document.scrollingElement || document.documentElement || document.body;

                if (elementoRolagem && typeof elementoRolagem.scrollTo === "function") {
                    elementoRolagem.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                }

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });

            window.addEventListener("scroll", atualizarBotaoTopo, { passive: true });
            document.addEventListener("scroll", atualizarBotaoTopo, { passive: true, capture: true });
            document.addEventListener("touchmove", atualizarBotaoTopo, { passive: true });
            window.addEventListener("resize", atualizarBotaoTopo);
            atualizarBotaoTopo();
        })();
    </script>
</body>
</html>
